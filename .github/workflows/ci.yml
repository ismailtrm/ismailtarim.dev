name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A deploy must not be killed half way by the next push; main runs queue instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun audit
      # Bundles the Worker without uploading it; no Cloudflare credentials needed.
      - run: bunx wrangler deploy --dry-run --outdir dist

  # Migrations can be hard to undo, so a run with unapplied ones waits for approval on the
  # `migrations` environment. The check asks D1 rather than diffing the push: a superseded or
  # rejected run must not hide a migration from the next one. Only these jobs read the token,
  # and forks never receive it; both environments are restricted to main.
  changes:
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    outputs:
      migrations: ${{ steps.pending.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      # wrangler needs Node; under the Bun runtime it exits 0 without doing anything.
      - id: pending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # Anything but wrangler's explicit all-clear counts as pending, so the gate fails closed.
        run: |
          out=$(node node_modules/wrangler/bin/wrangler.js d1 migrations list ismailtarim-db --remote)
          echo "$out"
          if grep -q 'No migrations to apply' <<< "$out"; then
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: node node_modules/wrangler/bin/wrangler.js d1 migrations apply ismailtarim-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: [changes, migrate]
    # `migrate` is skipped when nothing is pending; deploy unless it failed or was rejected.
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: node node_modules/wrangler/bin/wrangler.js deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
